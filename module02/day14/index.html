<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Market</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .product-card {
            position: relative;

            width: 300px;
            padding: 30px;

            border: 2px solid rgb(217, 86, 86);
        }

        .sale-badge {
            position: absolute;

            top: 10px;
            right: 10px;

            width: 70px;
            height: 70px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }
    </style>
</head>

<body>

    <div class="product-card">

        <span class="sale-badge">
            ETB Sale
        </span>

        <h2>Ethiopian Coffee</h2>

        <p>Fresh Ethiopian coffee.</p>

        <strong>500 ETB</strong>

    </div>

</body>

</html>
